# LF精炼炉加热模型 - 配置文件
# Configuration File for LF Refining Furnace Heating Model

# 数据库配置 (Database Configuration)
database:
  type: "sqlite"  # postgresql, mysql, oracle, sqlite
  host: "localhost"
  port: 5432
  database: "heat_model"
  username: "postgres"
  password: ""
  sqlite_path: "./heat_model.db"
  service_name: "ORCL"  # Oracle only
  create_tables: true

# 守护进程配置 (Daemon Configuration)
daemon:
  polling_interval: 2  # seconds
  max_retries: 3
  retry_delay: 5  # seconds

# 日志配置 (Logging Configuration)
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  console: true
  file: true
  file_path: "logs/heat_model.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Web UI配置 (Web UI Configuration)
web_ui:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  debug: false
  secret_key: "your-secret-key-change-in-production"

# 算法配置 (Algorithm Configuration)
algorithms:
  default: "Algorithm1"  # Algorithm1, Algorithm2, Algorithm3
  enabled:
    - "Algorithm1"
    - "Algorithm2"

  # 算法1: 历史数据预测 (Historical Data Prediction)
  algorithm1:
    name: "历史数据预测算法"
    description: "基于历史加热数据进行预测"
    precision: "high"
    min_historical_records: 10
    confidence_threshold: 0.7

  # 算法2: 公式计算 (Formula Calculation)
  algorithm2:
    name: "公式计算算法"
    description: "基于配置的数学公式计算"
    precision: "medium"
    formula_params:
      base_coefficient: 1.2
      temp_factor: 0.015
      stage_multiplier:
        初加热: 1.0
        精炼: 0.8
        保温: 0.5
        升温: 1.2
      steel_grade_modifier:
        碳钢: 1.0
        合金钢: 1.1
        不锈钢: 1.2
        高温合金: 1.3
      min_duration: 5.0
      max_duration: 120.0

# 加热参数限制 (Heating Parameter Limits)
heating:
  min_level: 1
  max_level: 10
  min_temp: 0
  max_temp: 2000  # Celsius
  min_duration: 5  # minutes
  max_duration: 120  # minutes

# 监控配置 (Monitoring Configuration)
monitoring:
  enabled: true
  metrics_retention_days: 30
  alert_on_errors: true
  performance_tracking: true

# 安全配置 (Security Configuration)
security:
  api_key_required: false
  api_key: ""
  rate_limiting: false
  max_requests_per_minute: 60
